<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Not Found - Simple With Us</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/site.css?v=4890c3842f5f">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      background-color: #f9f9f9;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.25rem;
      color: #666;
    }
    .countdown {
      font-weight: bold;
      color: #0070f3;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>

  <h1>404</h1>
  <p>We couldn't find that page.</p>
  <p>Redirecting to the homepage in <span id="timer" class="countdown">3</span>...</p>
  <p><a href="/">Go to the homepage</a></p>

  <script>
    let timeLeft = 3;
    const timerElement = document.getElementById('timer');

    const countdown = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        timerElement.textContent = timeLeft;
      } else {
        clearInterval(countdown);
        fetch("/", { method: "HEAD" }).then((response) => {
          if (response.status === 200) window.location.replace("/");
        }).catch(() => {});
      }
    }, 1000);
  </script>
</body>
</html>
