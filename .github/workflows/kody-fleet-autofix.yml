# DEFAULT-DISABLED SETUP DRAFT.  This is the fleet-standard Kody caller:
# the MiniMax M3 route, the same reusable workflow the other fleet repos
# pin.  Keep disabled until the budget approval and secure activation
# setup are ready.
# daily_attempt_limit is zero and budget_policy_id is pending.
name: Kody MiniMax M3 Fix Proposals

# Generated offline.  Missing SWU_KODY_AUTOFIX_ENABLED means disabled.
# Budget approval and protected-environment setup are separate owner actions.
# Daily attempt slots bound this repository only; they are not a dollar cap.
on:
  check_run:
    types: [completed]

permissions: {}

jobs:
  propose:
    # Caller-side same-repo guard.  The pinned helper still rejects a foreign
    # head before it reads source.  Concurrency is on this job and keyed by
    # app, conclusion, and head repository, so a skipped or unrelated
    # check_run cannot cancel a queued proposal.
    if: >-
      vars.SWU_KODY_AUTOFIX_ENABLED == 'true' &&
      github.event_name == 'check_run' && github.event.action == 'completed' &&
      github.run_attempt == 1 &&
      github.event.check_run.app.id == 413034 &&
      github.event.sender.type == 'Bot' && github.event.sender.id == 148880201 &&
      github.event.sender.login == 'kody-ai[bot]' &&
      github.event.check_run.conclusion == 'success' &&
      github.event.check_run.pull_requests[0].number != null &&
      github.event.check_run.pull_requests[0].head.repo.full_name == github.repository &&
      github.event.check_run.pull_requests[0].head.repo.fork == false &&
      github.event.check_run.pull_requests[1] == null
    concurrency:
      group: kody-caller-${{ github.repository_id }}-${{ github.event.check_run.app.id }}-${{ github.event.check_run.conclusion }}-${{ github.event.check_run.pull_requests[0].head.repo.full_name }}-${{ github.event.check_run.pull_requests[0].number || github.event.check_run.id }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    uses: Simple-With-Us/congress-trading-shared/.github/workflows/kody-autofix-reusable.yml@31659885f58f08e129b6dc092f3493d7cdb74a11
    with:
      repository_id: '1384087033'
      profile: 'python'
      source_prefixes: '["scripts/build_catalog.py","scripts/audit_catalog_links.py"]'
      model: 'MiniMax-M3'
      model_base_url: 'https://api.minimax.io/v1'
      daily_attempt_limit: 0
      budget_policy_id: 'pending'
    secrets:
      MODEL_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
